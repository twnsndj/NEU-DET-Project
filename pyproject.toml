[project]
name = "neu-det"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jake Townsend", email = "j@twnsnd.net" }
]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "kaggle>=2.2.5",
    "pillow>=13.0.0",
    "six>=1.17.0",
]

[project.scripts]
neu-det = "neu_det:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
